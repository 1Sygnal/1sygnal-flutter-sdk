name: onesygnal
description: "OneSygnal Flutter SDK — in-app surveys triggered by user events."
version: 1.0.0
homepage: https://1sygnal.app/
repository: https://github.com/1Sygnal/1sygnal-flutter-sdk
issue_tracker: https://github.com/1Sygnal/1sygnal-flutter-sdk/issues

environment:
  sdk: ^3.7.2
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  plugin:
    platforms:
      android:
        package: app.onesygnal.sdk.flutter
        pluginClass: OneSygnalPlugin
      ios:
        pluginClass: OneSygnalPlugin
